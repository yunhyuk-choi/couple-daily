# fly.toml — Fly.io deployment for couple-daily.
# Rename `app` to your own unique Fly app name (`fly apps create <name>`).
# NOTE: this is ready-to-use config; it was NOT actually deployed here.

app = "couple-daily"
primary_region = "nrt"  # Tokyo — closest to Korea; change as you like

[build]
  dockerfile = "Dockerfile"

[env]
  FLASK_ENV = "production"
  APP_NAME = "우리의 하루"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1   # keep 1 warm so sessions/streaks feel instant

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Secrets are NOT set here. Set them out-of-band (see README):
#   fly secrets set SECRET_KEY=... CLAUDE_CODE_OAUTH_TOKEN=... DATABASE_URL=...
