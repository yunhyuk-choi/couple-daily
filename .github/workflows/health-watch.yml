name: health-watch

# 앱이 죽어 있으면 **워크플로가 실패**해서 GitHub 가 알린다(2026-10 사고: 사용자가
# 앱을 열어 보고서야 죽은 걸 알았다 — 아무도 안 보고 있었다).
#
# 주기: 30분마다(:17·:47 — 정각은 GitHub cron 이 몰려 밀리고 가끔 누락된다).
#   * GitHub Actions: 이 리포는 public 이라 분이 무료·무제한이다. private 로 바뀌면
#     실행당 ~1분 × 48회/일 ≈ 1,440분/월 이 되어 무료 한도(2,000분/월)의 대부분을 쓴다 —
#     그때는 주기를 늘려라.
#   * ⚠️ /readyz 는 DB 왕복(SELECT 1)을 한다 → Neon 컴퓨트를 30분마다 깨운다. 무료 플랜의
#     컴퓨트 시간 한도가 걱정되면 주기를 늘려라(비용은 '깨어 있는 시간' 이다).
#   * ⚠️ 30분 간격은 Render 무료 인스턴스의 15분 유휴 슬립을 막지 못한다 — 감시가 올
#     때마다 콜드스타트를 거친다(그래서 첫 요청에 넉넉한 타임아웃·재시도를 준다).
#   * 이 워크플로는 60일 동안 리포 활동이 없으면 GitHub 가 스케줄을 자동 중지한다
#     (public 리포의 규칙). 감시가 조용히 꺼지지 않게 가끔 커밋이 있어야 한다.
#
# 확인하는 것:
#   /healthz  200 + {"status":"ok"}   — 프로세스가 산다(DB 안 탄다)
#   /readyz   200 + {"status":"ok"}   — DB 왕복 + 마이그레이션 성공까지
# 실패하면 응답 본문(자격증명 없음 — 코드 쪽이 예외 클래스 이름만 싣는다)을 로그에 찍는다.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch: {}

# Optional repository variable:
#   APP_URL — override the target base URL (defaults to the Render app).
permissions:
  contents: read

concurrency:
  group: health-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check /healthz and /readyz
        env:
          APP_URL: ${{ vars.APP_URL || 'https://couple-daily.onrender.com' }}
        run: |
          # 의도적으로 `set -e` 를 쓰지 않는다 — 한쪽이 실패해도 다른 쪽 결과를 같이 보고
          # 마지막에 한 번에 실패시킨다. curl 뒤의 `|| true` 는 종료코드 대신 아래에서
          # HTTP 코드·본문을 **직접** 검사하려는 것이다 — 실패는 fail=1 → exit 1 로 남는다.
          fail=0

          check() {
            name="$1"
            echo "::group::${name}"
            # --fail-with-body: HTTP 4xx/5xx 도 '실패'(종료코드 22)로 보고 본문은 남긴다.
            # 콜드스타트(30~60초)·배포 직후 503 을 견디도록 재시도한다.
            code=$(curl --silent --show-error --fail-with-body \
                        --max-time 60 --retry 2 --retry-delay 20 --retry-all-errors \
                        --output body.json --write-out '%{http_code}' \
                        "${APP_URL}/${name}") || true
            echo "HTTP ${code:-000}"
            cat body.json 2>/dev/null || true
            echo
            echo "::endgroup::"
            if [ "${code:-000}" != "200" ] || ! jq -e '.status == "ok"' body.json >/dev/null 2>&1; then
              echo "::error title=${name} unhealthy::${APP_URL}/${name} -> HTTP ${code:-000}"
              return 1
            fi
          }

          check healthz || fail=1
          check readyz  || fail=1
          exit "$fail"
