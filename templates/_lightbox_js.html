<script>
// 공용 라이트박스 — 썸네일 탭 시 **미리보기 자산**(view 티어) 프리로드 + 확대.
//
// ⛔ 여기서 띄우는 건 **원본이 아니다**(data-full = /memories/<id>/preview · 긴 변
//    1280). 폰 전체화면(390×844 CSS · DPR 3 = 1170px)을 덮고도 남는 크기라 보이는
//    차이가 없는데, 원본(3MB+)을 띄우면 '크게 보기' 한 번에 수 MB를 기다린다.
//    원본이 필요한 자리는 **'다운로드'** 버튼 하나뿐이고 거기는 그대로 원본이다
//    (data-download = /memories/<id>/image?download=1 · 원본 바이트·원본 파일명).
//    되돌리려면 _photo_grid.html 의 data-full 을 memory_image 로 바꾸면 된다.
(function () {
  var openers = Array.prototype.slice.call(document.querySelectorAll(".photo-open"));
  var lb = document.getElementById("lightbox");
  if (!openers.length || !lb) return;

  var lbImg = document.getElementById("lb-img");
  var lbCap = document.getElementById("lb-caption");
  var lbFailed = document.getElementById("lb-failed");
  var lbTags = document.getElementById("lb-tags");
  var lbDownload = document.getElementById("lb-download");
  var lbDeleteForm = document.getElementById("lb-delete-form");
  var lbClose = document.getElementById("lb-close");
  var preloaded = {}; // full url -> Image (keeps decoded bytes warm)

  function preload(url) {
    if (!url || preloaded[url]) return;
    var im = new Image();
    im.src = url;
    preloaded[url] = im;
  }

  // ⛔ **화면에 보이는 사진의 원본을 미리 받지 않는다.**
  // 예전엔 IntersectionObserver 로 뷰포트 근처(300px) 사진의 **원본을 전부** 당겨
  // 왔다. 한 장이 3MB 이고 그리드에 20장이면 아무것도 안 눌러도 60MB 를 우리 프록시로
  // 흘린 셈이다 — 0.1 CPU 워커에서 그게 곧 그리드가 버벅이는 이유였다(그리드가 쓰는
  // 썸네일 요청들과 같은 줄에 선다). 원본은 '열겠다는 신호'가 왔을 때만 받는다:
  //   * 포인터가 올라오거나(hover/pointerdown) — 탭 전에 미리 시작된다
  //   * 라이트박스를 열면 그 **양옆** 한 장씩(스와이프 대비)
  // 그 전까지 화면은 이미 받아 둔 썸네일만 쓴다.
  function preloadOn(el) { preload(el.getAttribute("data-full")); }
  openers.forEach(function (el) {
    ["pointerdown", "pointerenter", "focus"].forEach(function (ev) {
      el.addEventListener(ev, function () { preloadOn(el); }, { once: true });
    });
  });

  function neighbors(idx) {
    [idx - 1, idx + 1].forEach(function (j) {
      if (j >= 0 && j < openers.length) preload(openers[j].getAttribute("data-full"));
    });
  }

  function openAt(idx) {
    var el = openers[idx];
    // 즉시 보이기 — 그리드가 이미 받아 둔 **썸네일을 placeholder 로** 먼저 깔고
    // (네트워크 0, 브라우저 캐시 히트), 원본이 도착하면 바꿔 끼운다. 최종 픽셀은
    // 예전과 **완전히 같다** — 달라지는 건 '빈 화면을 보는 시간'뿐이다.
    var full = el.getAttribute("data-full");
    var thumb = el.getAttribute("data-thumb");
    var warm = preloaded[full];
    if (warm && warm.complete && warm.naturalWidth > 0) {
      lbImg.classList.remove("lb-placeholder");
      lbImg.src = full;
    } else {
      if (thumb) {
        lbImg.src = thumb;
        lbImg.classList.add("lb-placeholder");
      }
      var hi = new Image();
      hi.onload = function () {
        // 그 사이 다른 사진으로 넘어갔으면 덮어쓰지 않는다.
        if (lbImg.getAttribute("data-want") !== full) return;
        lbImg.classList.remove("lb-placeholder");
        lbImg.src = full;
      };
      hi.src = full;
      preloaded[full] = hi;
    }
    lbImg.setAttribute("data-want", full);
    var cap = el.getAttribute("data-caption") || "";
    if (cap) { lbCap.textContent = cap; lbCap.hidden = false; }
    else { lbCap.hidden = true; }
    // 캡션 분석에 실패한 사진은 조용히 "분석 실패" 안내를 보여준다.
    if (lbFailed) lbFailed.hidden = (el.getAttribute("data-status") !== "failed");
    var tags = (el.getAttribute("data-tags") || "").split(",").filter(Boolean);
    lbTags.innerHTML = "";
    if (tags.length) {
      tags.forEach(function (t) {
        var s = document.createElement("span");
        s.className = "chip small";
        s.textContent = "#" + t;
        lbTags.appendChild(s);
      });
      lbTags.hidden = false;
    } else {
      lbTags.hidden = true;
    }
    lbDownload.href = el.getAttribute("data-download");
    if (lbDeleteForm) lbDeleteForm.action = el.getAttribute("data-delete");
    lb.hidden = false;
    lb.setAttribute("aria-hidden", "false");
    document.body.classList.add("lb-open");
    neighbors(idx);
  }

  function close() {
    lb.hidden = true;
    lb.setAttribute("aria-hidden", "true");
    document.body.classList.remove("lb-open");
    lbImg.removeAttribute("src");
  }

  openers.forEach(function (el, idx) {
    el.addEventListener("click", function () { openAt(idx); });
  });
  lbClose.addEventListener("click", close);
  lb.addEventListener("click", function (e) {
    if (e.target === lb || e.target.classList.contains("lb-stage")) close();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !lb.hidden) close();
  });
})();
</script>
