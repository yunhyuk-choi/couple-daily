<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>사내 Claude 통합 래퍼</title>
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        background-color: #1e1e1e;
        color: #d4d4d4;
      }
      h2 {
        color: #569cd6;
        border-bottom: 1px solid #3c3c3c;
        padding-bottom: 10px;
      }

      /* 로그인 섹션 */
      #login-section {
        background-color: #252526;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 20px;
        border: 1px solid #3c3c3c;
      }
      #auth-link {
        color: #4ec9b0;
        font-weight: bold;
        word-break: break-all;
      }
      .info-box {
        background-color: #332b00;
        padding: 10px;
        border-left: 4px solid #cca700;
        margin: 15px 0;
        font-size: 0.9em;
      }

      /* 채팅 섹션 */
      #chat-section {
        display: none;
      } /* 로그인 전에는 숨김 */
      #chat-box {
        background-color: #2d2d2d;
        border-radius: 8px;
        padding: 20px;
        height: 400px;
        overflow-y: auto;
        margin-bottom: 20px;
        font-family: Consolas, monospace;
        line-height: 1.6;
      }

      /* 공통 폼 스타일 */
      .flex-form {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }
      input[type="text"] {
        flex: 1;
        padding: 10px;
        border-radius: 4px;
        border: 1px solid #3c3c3c;
        background-color: #3c3c3c;
        color: white;
      }
      button {
        padding: 10px 20px;
        background-color: #0e639c;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover {
        background-color: #1177bb;
      }
      button:disabled {
        background-color: #555;
        cursor: not-allowed;
      }

      .user-msg {
        color: #4ec9b0;
        margin: 15px 0 5px 0;
        font-weight: bold;
      }
      .ai-msg {
        margin-bottom: 20px;
        border-left: 2px solid #569cd6;
        padding-left: 10px;
      }
    </style>
  </head>
  <body>
    <h2>⚡ 사내 Claude Web Wrapper</h2>

    <!-- 1. 로그인 구역 -->
    <div id="login-section">
      <h3>1단계: 세션 로그인</h3>
      <button id="start-login-btn">로그인 URL 발급받기</button>

      <div id="login-step2" style="display: none">
        <p>1. 아래 링크를 클릭하여 브라우저에서 로그인을 완료하세요.</p>
        <p>
          <a href="#" id="auth-link" target="_blank"
            >여기에 링크가 표시됩니다</a
          >
        </p>

        <div class="info-box">
          💡 <b>안내:</b> 로그인을 마치면 화면에 표시되는
          <b>인증 코드(<code>코드#상태</code> 형태)를 통째로 복사</b>해서 아래에
          붙여넣어 주세요. (예: <code>6v0pLOR...#6_tmngG...</code>)
        </div>

        <div class="flex-form">
          <input
            type="text"
            id="auth-code-input"
            placeholder="인증 코드 붙여넣기 (code#state)"
          />
          <button id="complete-login-btn">인증 완료</button>
        </div>
      </div>
    </div>

    <!-- 2. 채팅 구역 -->
    <div id="chat-section">
      <div id="chat-box"></div>
      <form class="flex-form" id="ask-form">
        <input
          type="text"
          id="prompt"
          placeholder="클로드에게 질문할 내용을 입력하세요..."
          required
        />
        <button type="submit" id="submit-btn">전송</button>
      </form>
    </div>

    <script>
      // --- [로그인 로직] ---
      const startLoginBtn = document.getElementById("start-login-btn");
      const completeLoginBtn = document.getElementById("complete-login-btn");
      const loginSection = document.getElementById("login-section");
      const chatSection = document.getElementById("chat-section");

      startLoginBtn.addEventListener("click", async () => {
        startLoginBtn.innerText = "URL 발급 중...";
        startLoginBtn.disabled = true;

        const res = await fetch("/start-login", { method: "POST" });
        const data = await res.json();

        if (data.status === "success") {
          document.getElementById("auth-link").href = data.url;
          document.getElementById("auth-link").innerText = data.url;
          document.getElementById("login-step2").style.display = "block";
          startLoginBtn.innerText = "발급 완료";
        } else {
          alert("에러: " + data.message);
          startLoginBtn.innerText = "로그인 URL 발급받기";
          startLoginBtn.disabled = false;
        }
      });

      completeLoginBtn.addEventListener("click", async () => {
        const authCode = document
          .getElementById("auth-code-input")
          .value.trim();
        if (!authCode) {
          alert("인증 코드를 붙여넣어 주세요.");
          return;
        }

        completeLoginBtn.innerText = "처리 중...";
        completeLoginBtn.disabled = true;

        const res = await fetch("/complete-login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code: authCode }),
        });
        const data = await res.json();

        if (data.status === "success") {
          alert("로그인이 완료되었습니다! 이제 채팅을 시작할 수 있습니다.");
          loginSection.style.display = "none"; // 로그인 창 숨기기
          chatSection.style.display = "block"; // 채팅 창 열기
        } else {
          alert("에러: " + data.message);
          completeLoginBtn.innerText = "인증 완료";
          completeLoginBtn.disabled = false;
        }
      });

      // --- [채팅 스트리밍 로직] ---
      const form = document.getElementById("ask-form");
      const chatBox = document.getElementById("chat-box");
      const submitBtn = document.getElementById("submit-btn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const promptInput = document.getElementById("prompt");
        const userText = promptInput.value;
        promptInput.value = "";
        submitBtn.disabled = true;

        chatBox.innerHTML += `<div class="user-msg">&gt; ${userText}</div>`;
        chatBox.innerHTML += `<div class="ai-msg" id="current-response"></div>`;
        const currentResponseDiv = document.getElementById("current-response");
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
          const formData = new FormData();
          formData.append("prompt", userText);

          const response = await fetch("/ask", {
            method: "POST",
            body: formData,
          });
          const reader = response.body.getReader();
          const decoder = new TextDecoder("utf-8");

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const textChunk = decoder.decode(value, { stream: true });
            currentResponseDiv.innerHTML += textChunk;
            chatBox.scrollTop = chatBox.scrollHeight;
          }
          currentResponseDiv.removeAttribute("id");
        } catch (error) {
          currentResponseDiv.innerHTML += `<br><span style="color: #f48771;">[통신 에러가 발생했습니다]</span>`;
        } finally {
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
