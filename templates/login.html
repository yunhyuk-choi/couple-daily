{% extends "base.html" %}
{% block title %}로그인 · {{ app_name }}{% endblock %}
{% block content %}
<div class="card auth-card">
  <img class="emoji hero" src="{{ url_for('static', filename='emoji/locked.svg') }}" alt="" />
  <h1>다시 만나서 반가워</h1>
  <p class="muted">{{ app_name }}에 로그인해줘.</p>
  <form method="post" class="stack">
    <label>이메일
      <input type="email" name="email" required autocomplete="email" />
    </label>
    <label>비밀번호
      <input type="password" name="password" required autocomplete="current-password" />
    </label>
    <label class="check-row">
      <input type="checkbox" name="remember" value="1" checked />
      로그인 유지
    </label>
    <button type="submit" class="btn primary">로그인</button>
  </form>
  {% if kakao_enabled %}
  <div class="or-divider"><span>또는</span></div>
  <a class="btn kakao" href="{{ url_for('kakao_login') }}">카카오로 시작하기</a>
  {% endif %}
  <p class="muted center">
    아직 계정이 없어? <a href="{{ url_for('signup') }}">회원가입</a>
  </p>
</div>
{% endblock %}
