{% extends "base.html" %}
{% block title %}커플 공간 연결 · {{ app_name }}{% endblock %}
{% block content %}
<div class="card auth-card">
  <img class="emoji hero" src="{{ url_for('static', filename='emoji/sparkling_heart.svg') }}" alt="" />
  <h1>커플 공간에 연결하기</h1>
  <p class="muted">
    카카오로 로그인했어{% if nickname %}, <strong>{{ nickname }}</strong>님{% endif %}!<br />
    처음이라면 초대 코드는 비워둬 — 네가 커플 공간을 만들고 초대 코드를 받게 돼.<br />
    파트너가 이미 만들었다면 받은 초대 코드를 입력해줘.
  </p>
  <form method="post" class="stack">
    <label>이름 (상대가 볼 이름)
      <input type="text" name="display_name" required maxlength="60" value="{{ nickname or '' }}" />
    </label>
    <label>초대 코드 <span class="muted">(선택)</span>
      <input type="text" name="invite_code" maxlength="8" value="{{ invite_code or '' }}" placeholder="파트너에게 받은 코드" style="text-transform: uppercase" />
    </label>
    <button type="submit" class="btn primary">시작하기</button>
  </form>
  <p class="muted center">
    <a href="{{ url_for('login') }}">돌아가기</a>
  </p>
</div>
{% endblock %}
