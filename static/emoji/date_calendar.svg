<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- 핀 그라데이션 -->
    <linearGradient id="dateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7EB3" />
      <stop offset="100%" stop-color="#FF758C" />
    </linearGradient>

    <!-- 부드러운 발광 효과 -->
    <filter id="dateGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#FF758C" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 위치 핀 몸통(물방울) -->
  <path d="M 60 22
           C 41 22, 26 37, 26 56
           C 26 80, 52 98, 59 104
           C 59.6 104.5, 60.4 104.5, 61 104
           C 68 98, 94 80, 94 56
           C 94 37, 79 22, 60 22 Z"
        fill="url(#dateGrad)" filter="url(#dateGlow)" />

  <!-- 안쪽 하트 -->
  <path d="M 60 74
           C 52.5 68, 44 60.5, 44 52.5
           A 8.2 8.2 0 0 1 60 48.6
           A 8.2 8.2 0 0 1 76 52.5
           C 76 60.5, 67.5 68, 60 74 Z"
        fill="#FF4D79" />
</svg>
