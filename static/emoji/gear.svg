<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7EB3" />
      <stop offset="100%" stop-color="#FF758C" />
    </linearGradient>
    <filter id="gearGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#FF758C" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#gearGlow)">
    <!-- 톱니 8개 -->
    <g fill="url(#gearGrad)">
      <rect x="51" y="16" width="18" height="20" rx="6" transform="rotate(0 60 60)" />
      <rect x="51" y="16" width="18" height="20" rx="6" transform="rotate(45 60 60)" />
      <rect x="51" y="16" width="18" height="20" rx="6" transform="rotate(90 60 60)" />
      <rect x="51" y="16" width="18" height="20" rx="6" transform="rotate(135 60 60)" />
      <rect x="51" y="16" width="18" height="20" rx="6" transform="rotate(180 60 60)" />
      <rect x="51" y="16" width="18" height="20" rx="6" transform="rotate(225 60 60)" />
      <rect x="51" y="16" width="18" height="20" rx="6" transform="rotate(270 60 60)" />
      <rect x="51" y="16" width="18" height="20" rx="6" transform="rotate(315 60 60)" />
    </g>
    <!-- 기어 본체 (가운데 구멍) -->
    <path fill-rule="evenodd" fill="url(#gearGrad)"
          d="M 28 60 A 32 32 0 1 0 92 60 A 32 32 0 1 0 28 60 Z
             M 46 60 A 14 14 0 1 1 74 60 A 14 14 0 1 1 46 60 Z" />
  </g>
</svg>
