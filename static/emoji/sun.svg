<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7EB3" />
      <stop offset="100%" stop-color="#FF758C" />
    </linearGradient>
    <filter id="sunGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#FF758C" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 광선 -->
  <g stroke="url(#sunGrad)" stroke-width="9" stroke-linecap="round" filter="url(#sunGlow)">
    <line x1="60" y1="33" x2="60" y2="18" />
    <line x1="60" y1="102" x2="60" y2="87" />
    <line x1="33" y1="60" x2="18" y2="60" />
    <line x1="102" y1="60" x2="87" y2="60" />
    <line x1="40.9" y1="40.9" x2="30.3" y2="30.3" />
    <line x1="89.7" y1="89.7" x2="79.1" y2="79.1" />
    <line x1="40.9" y1="79.1" x2="30.3" y2="89.7" />
    <line x1="89.7" y1="30.3" x2="79.1" y2="40.9" />
  </g>

  <!-- 둥근 중심 -->
  <circle cx="60" cy="60" r="20" fill="url(#sunGrad)" filter="url(#sunGlow)" />
  <!-- 하트 하이라이트 -->
  <path d="M 60 68
           C 55 64, 50.5 60, 50.5 55.5
           A 4.6 4.6 0 0 1 60 53.2
           A 4.6 4.6 0 0 1 69.5 55.5
           C 69.5 60, 65 64, 60 68 Z"
        fill="#FF4D79" />
</svg>
