<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- 종 그라데이션 -->
    <linearGradient id="bellGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7EB3" />
      <stop offset="100%" stop-color="#FF758C" />
    </linearGradient>

    <!-- 부드러운 발광 효과 -->
    <filter id="bellGlow2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#FF758C" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 종 손잡이 -->
  <rect x="55" y="20" width="10" height="12" rx="5" fill="url(#bellGrad2)" />

  <!-- 종 몸통 -->
  <path d="M 60 28
           C 48 28, 38 39, 38 54
           C 38 65, 35 73, 29 78
           C 27 80.5, 29 83, 32 83
           L 88 83
           C 91 83, 93 80.5, 91 78
           C 85 73, 82 65, 82 54
           C 82 39, 72 28, 60 28 Z"
        fill="url(#bellGrad2)" filter="url(#bellGlow2)" />

  <!-- 종 테두리 -->
  <rect x="26" y="80" width="68" height="9" rx="4.5" fill="#FF4D79" />

  <!-- 하트 종추 -->
  <path d="M 60 104
           C 55.5 100, 50 95.2, 50 89.8
           A 5 5 0 0 1 60 87.4
           A 5 5 0 0 1 70 89.8
           C 70 95.2, 64.5 100, 60 104 Z"
        fill="#FF4D79" filter="url(#bellGlow2)" />
</svg>
