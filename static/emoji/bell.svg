<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- 배경 그라데이션 (차트 아이콘과 동일 팔레트) -->
    <linearGradient id="bellBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEDF1" />
      <stop offset="100%" stop-color="#FFD3E1" />
    </linearGradient>

    <!-- 종 그라데이션 -->
    <linearGradient id="bellGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7EB3" />
      <stop offset="100%" stop-color="#FF758C" />
    </linearGradient>

    <!-- 아이콘 배경 그림자 -->
    <filter id="bellShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#FF8FA3" flood-opacity="0.25"/>
    </filter>

    <!-- 부드러운 발광 효과 -->
    <filter id="bellGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#FF758C" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 둥근 배경 -->
  <rect x="15" y="15" width="90" height="90" rx="24" fill="url(#bellBg)" filter="url(#bellShadow)" />

  <!-- 종 손잡이 -->
  <rect x="56" y="30" width="8" height="9" rx="4" fill="url(#bellGrad)" />

  <!-- 종 몸통 -->
  <path d="M 60 36
           C 51 36, 44 44, 44 55
           C 44 63, 42 69, 38 73
           C 37 75, 38 76.5, 40 76.5
           L 80 76.5
           C 82 76.5, 83 75, 82 73
           C 78 69, 76 63, 76 55
           C 76 44, 69 36, 60 36 Z"
        fill="url(#bellGrad)" filter="url(#bellGlow)" />

  <!-- 종 테두리 -->
  <rect x="35" y="74" width="50" height="6.5" rx="3.25" fill="#FF4D79" />

  <!-- 하트 종추 -->
  <path d="M 60 90.5
           C 57.5 88, 54 85.2, 54 82
           A 3.1 3.1 0 0 1 60 79.9
           A 3.1 3.1 0 0 1 66 82
           C 66 85.2, 62.5 88, 60 90.5 Z"
        fill="#FF4D79" filter="url(#bellGlow)" />
</svg>
