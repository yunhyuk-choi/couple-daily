<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="calGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7EB3" />
      <stop offset="100%" stop-color="#FF758C" />
    </linearGradient>
    <filter id="calGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#FF758C" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 상단 링(제본) -->
  <rect x="38" y="20" width="9" height="20" rx="4.5" fill="#FF4D79" />
  <rect x="73" y="20" width="9" height="20" rx="4.5" fill="#FF4D79" />

  <!-- 달력 몸통 -->
  <rect x="24" y="30" width="72" height="68" rx="14" fill="url(#calGrad)" filter="url(#calGlow)" />

  <!-- 상단 헤더 밴드 (윗 모서리만 둥글게) -->
  <path d="M 24 48 L 24 44 Q 24 30 38 30 L 82 30 Q 96 30 96 44 L 96 48 Z"
        fill="#FF4D79" />

  <!-- 날짜 점 -->
  <circle cx="42" cy="66" r="4" fill="#FFE3EC" />
  <circle cx="60" cy="66" r="4" fill="#FFE3EC" />
  <circle cx="78" cy="66" r="4" fill="#FFE3EC" />

  <!-- 표시된 날짜: 하트 -->
  <path d="M 60 90
           C 54 85, 47.5 79.5, 47.5 73.5
           A 6.2 6.2 0 0 1 60 70.6
           A 6.2 6.2 0 0 1 72.5 73.5
           C 72.5 79.5, 66 85, 60 90 Z"
        fill="#FF4D79" filter="url(#calGlow)" />
</svg>
