<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- 배경 그라데이션 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEDF1" />
      <stop offset="100%" stop-color="#FFD3E1" />
    </linearGradient>
    
    <!-- 그래프 선 그라데이션 -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF758C" />
      <stop offset="100%" stop-color="#FF7EB3" />
    </linearGradient>
    
    <!-- 아이콘 배경 그림자 -->
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#FF8FA3" flood-opacity="0.25"/>
    </filter>
    
    <!-- 선과 하트에 들어갈 부드러운 발광 효과 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#FF758C" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 둥근 배경 -->
  <rect x="15" y="15" width="90" height="90" rx="24" fill="url(#bgGrad)" filter="url(#boxShadow)" />

  <!-- 은은한 격자 무늬 -->
  <!-- 가로선 -->
  <line x1="15" y1="45" x2="105" y2="45" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6" />
  <line x1="15" y1="75" x2="105" y2="75" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6" />
  <!-- 세로선 -->
  <line x1="45" y1="15" x2="45" y2="105" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6" />
  <line x1="75" y1="15" x2="75" y2="105" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6" />

  <!-- 그래프 라인 -->
  <path d="M 25 85 L 45 55 L 65 65 L 85 35"
        fill="none" stroke="url(#lineGrad)" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- 시작점 동그라미 -->
  <circle cx="25" cy="85" r="4.5" fill="#FF758C" />

  <!-- 최고점 하트 포인트 -->
  <path d="M 85 35 
           C 80 31, 75 26, 75 21 
           A 5.5 5.5 0 0 1 85 17 
           A 5.5 5.5 0 0 1 95 21 
           C 95 26, 90 31, 85 35 Z" 
        fill="#FF4D79" filter="url(#glow)" />
</svg>
