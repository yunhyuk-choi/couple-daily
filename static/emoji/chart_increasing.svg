<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- 그래프 선 그라데이션 -->
    <linearGradient id="lineGradFlat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF758C" />
      <stop offset="100%" stop-color="#FF7EB3" />
    </linearGradient>

    <!-- 선과 하트에 들어갈 부드러운 발광 효과 -->
    <filter id="glowFlat" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#FF758C" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 그래프 라인 -->
  <path d="M 22 92 L 48 56 L 70 68 L 92 34"
        fill="none" stroke="url(#lineGradFlat)" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glowFlat)" />

  <!-- 시작점 동그라미 -->
  <circle cx="22" cy="92" r="6" fill="#FF758C" />

  <!-- 최고점 하트 포인트 -->
  <path d="M 92 34
           C 85 28.5, 78 22, 78 15.5
           A 7 7 0 0 1 92 13.1
           A 7 7 0 0 1 106 15.5
           C 106 22, 99 28.5, 92 34 Z"
        fill="#FF4D79" filter="url(#glowFlat)" />
</svg>
